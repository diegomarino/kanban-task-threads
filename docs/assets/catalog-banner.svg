<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Kanban Task Threads catalog banner</title>
  <desc id="desc">A dark banner showing the Kanban Task Threads name beside a real Discord thread with an actor-signed event history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a25"/>
      <stop offset="0.58" stop-color="#0b1119"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2431"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="discord-shot">
      <rect x="758" y="20" width="372" height="560" rx="17"/>
    </clipPath>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="1030" cy="96" r="190" fill="#2563eb" opacity="0.08" filter="url(#glow)"/>
  <circle cx="692" cy="548" r="160" fill="#7c3aed" opacity="0.07" filter="url(#glow)"/>

  <!-- Product identity -->
  <g transform="translate(64 56)">
    <text x="0" y="25" fill="#91a0b5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" letter-spacing="2.4">HERMES AGENT PLUGIN</text>

    <text x="0" y="126" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="760" letter-spacing="-2.6">Kanban Task</text>
    <text x="0" y="198" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="68" font-weight="760" letter-spacing="-2.6">Threads</text>

    <text x="0" y="257" fill="#b3bfd0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="450">Turn Hermes tasks into Discord forum threads</text>
    <text x="0" y="291" fill="#b3bfd0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="450">with a durable, actor-signed activity log.</text>

    <g transform="translate(0 338)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="620">
      <g>
        <rect width="126" height="36" rx="18" fill="#172334" stroke="#304158"/>
        <circle cx="18" cy="18" r="5" fill="#60a5fa"/>
        <text x="32" y="18" fill="#d8e1ed" dominant-baseline="middle">Live cards</text>
      </g>
      <g transform="translate(140 0)">
        <rect width="158" height="36" rx="18" fill="#172334" stroke="#304158"/>
        <circle cx="15" cy="18" r="5" fill="#a78bfa"/>
        <text x="29" y="18" fill="#d8e1ed" dominant-baseline="middle">Signed updates</text>
      </g>
      <g transform="translate(312 0)">
        <rect width="130" height="36" rx="18" fill="#172334" stroke="#304158"/>
        <circle cx="17" cy="18" r="5" fill="#34d399"/>
        <text x="31" y="18" fill="#d8e1ed" dominant-baseline="middle">Status tags</text>
      </g>
    </g>
  </g>

  <!-- Real product proof -->
  <g filter="url(#shadow)">
    <rect x="752" y="14" width="384" height="572" rx="23" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
    <image href="catalog-banner-detail.png" x="758" y="20" width="372" height="560" preserveAspectRatio="xMidYMid meet" clip-path="url(#discord-shot)"/>
  </g>
</svg>

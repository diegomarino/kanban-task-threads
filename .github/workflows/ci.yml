name: CI

on:
  push:
    branches: [pre-release, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr-policy:
    name: Main PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Require promotion or Release Please for main
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ] || [ "${BASE_REF}" != "main" ]; then
            exit 0
          fi
          if [ "${HEAD_REPOSITORY}" = "${REPOSITORY}" ] && \
             [ "${HEAD_REF}" = "pre-release" ]; then
            exit 0
          fi
          if [ "${HEAD_REPOSITORY}" = "${REPOSITORY}" ] && \
             [ "${HEAD_REF}" = "release-please--branches--main" ] && \
             [ "${PR_AUTHOR}" = "github-actions[bot]" ]; then
            exit 0
          fi
          echo "Only the pre-release promotion or Release Please may target main." >&2
          exit 1

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false
      - name: Install pinned quality tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.8
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests
        run: python -m pytest tests/

  hermes-validate:
    name: Hermes plugin validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: Check out pinned Hermes validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: 345cd2b057a452236de401d3534b8502a7465e8d
          path: hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned Hermes
        run: python -m pip install -e hermes-agent
      - name: Validate plugin contract
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_KANBAN_HOME: ${{ runner.temp }}/hermes-home
          OP_LOAD_DESKTOP_APP_SETTINGS: "false"
          OP_BIOMETRIC_UNLOCK_ENABLED: "false"
        run: hermes plugins validate plugin --json

  plugin-scanner:
    name: HOL plugin scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan public plugin tree
        uses: hashgraph-online/ai-plugin-scanner-action@15c88627e5d1bced0f9b1ca162e449b421438558 # v1.2.692
        with:
          plugin_dir: "."
          mode: scan
          profile: public-marketplace
          format: sarif
          output: plugin-scanner.sarif
          min_score: 80
          fail_on_severity: high
          upload_sarif: false
      - name: Upload scanner SARIF
        if: ${{ always() && hashFiles('plugin-scanner.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: plugin-scanner.sarif
          category: ai-plugin-scanner

  release-please:
    name: Release Please
    needs: [pr-policy, quality, hermes-validate, plugin-scanner]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Open or update the release PR, or publish a merged release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

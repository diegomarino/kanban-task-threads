name: PR validation

on:
  pull_request:
    branches: [pre-release]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Run the canonical fast gate
        run: python3 scripts/check.py fast
      - name: Classify integration-sensitive changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${BASE_SHA}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Invalid pull request base SHA" >&2; exit 1 ;;
          esac
          case "${HEAD_SHA}" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Invalid pull request head SHA" >&2; exit 1 ;;
          esac
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "${CHECKED_OUT_SHA}" != "${HEAD_SHA}" ]; then
            echo "Checked out commit does not match the pull request head" >&2
            exit 1
          fi
          integration_changed=false
          while IFS= read -r path; do
            case "${path}" in
              __init__.py|plugin.yaml|kanban_task_threads/runtime.py|scripts/check_startup.py|.github/workflows/ci.yml)
                integration_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          printf 'integration_changed=%s\n' "${integration_changed}" >> "${GITHUB_OUTPUT}"
      - name: Check out the supported Hermes validator
        if: steps.changes.outputs.integration_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: NousResearch/hermes-agent
          ref: 345cd2b057a452236de401d3534b8502a7465e8d # v2026.9.14 / Hermes 0.21.3
          path: hermes-agent
          persist-credentials: false
      - name: Install the supported Hermes validator
        if: steps.changes.outputs.integration_changed == 'true'
        run: python -m pip install -e hermes-agent
      - name: Check deferred startup with the supported Hermes APIs
        if: steps.changes.outputs.integration_changed == 'true'
        run: python scripts/check_startup.py
      - name: Validate the plugin contract with supported Hermes
        if: steps.changes.outputs.integration_changed == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          HERMES_KANBAN_HOME: ${{ runner.temp }}/hermes-home
          OP_LOAD_DESKTOP_APP_SETTINGS: "false"
          OP_BIOMETRIC_UNLOCK_ENABLED: "false"
        run: hermes plugins validate . --json

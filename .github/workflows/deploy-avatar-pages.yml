name: Deploy avatar assets to Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/deploy-avatar-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: avatar-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload avatar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
